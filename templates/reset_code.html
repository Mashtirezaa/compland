{% extends 'base.html' %}
{% block title %}کد بازیابی{% endblock %}
{% block content %}
<style>
  .footer { display: none !important; }
  body { overflow: hidden; }
  main { padding-bottom: 0 !important; min-height: 0 !important; }
  .register-page {
    height: calc(100dvh - 168px);
    max-height: calc(100dvh - 168px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding-bottom: 14px;
    box-sizing: border-box;
  }
  .register-page .box { width: min(440px, 100%); margin: 0; padding: 22px 24px 18px; border-radius: 16px; }
  .register-page h1 { font-size: 1.2rem; margin-bottom: 8px; text-align: center; }
  .register-page .field input { letter-spacing: 8px; text-align: center; font-size: 1.2rem; }
  .register-page .btn.block { margin-top: 12px; }
  .register-page .muted { margin-top: 8px; }
</style>
<div class="container register-page">
  <div class="box">
    <form method="post">
      {% csrf_token %}
      <h1>کد بازیابی رمز</h1>
      <p class="muted center">کد ۶ رقمی به {{ email }} ارسال شد.</p>
      {% include 'partials/form_fields.html' %}
      <button class="btn block">ادامه</button>
    </form>
    <div class="muted center" style="display:flex;gap:18px;justify-content:center;flex-wrap:wrap;margin-top:10px">
      <form method="post" action="{% url 'accounts:reset_resend' %}">{% csrf_token %}<button type="submit" class="link resend-btn" data-wait="{{ wait|default:0 }}"{% if wait %} disabled{% endif %}>ارسال دوباره کد</button></form>
      <a class="link" href="{% url 'accounts:forgot' %}">تغییر ایمیل</a>
    </div>
  </div>
</div>
{% endblock %}

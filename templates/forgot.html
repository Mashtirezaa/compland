{% extends 'base.html' %}
{% block title %}بازیابی رمز{% endblock %}
{% block content %}
<style>
  .footer { display: none !important; }
  body { overflow: hidden; }
  main { padding-bottom: 0 !important; min-height: 0 !important; }
  .register-page {
    height: calc(100dvh - 168px);
    max-height: calc(100dvh - 168px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding-bottom: 14px;
    box-sizing: border-box;
  }
  .register-page .box { width: min(440px, 100%); margin: 0; padding: 22px 24px 18px; border-radius: 16px; }
  .register-page h1 { font-size: 1.2rem; margin-bottom: 8px; text-align: center; }
  .register-page .btn.block { margin-top: 12px; }
  .register-page .muted { margin-top: 8px; }
</style>
<div class="container register-page">
  <form method="post" class="box">
    {% csrf_token %}
    <h1>بازیابی رمز عبور</h1>
    <p class="muted center">ایمیل حساب خود را وارد کنید.</p>
    {% include 'partials/form_fields.html' %}
    <button class="btn block">ارسال کد</button>
    <p class="muted center"><a class="link" href="{% url 'accounts:login' %}">بازگشت به ورود</a></p>
  </form>
</div>
{% endblock %}

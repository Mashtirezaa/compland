{% extends 'base.html' %}
{% block title %}ورود{% endblock %}
{% block content %}
<div class="container auth">
  <form method="post" class="box">
    {% csrf_token %}
    <h1>ورود به حساب</h1>
    <input type="hidden" name="next" value="{{ next }}">
    {% include 'partials/form_fields.html' %}
    <button class="btn block">ورود</button>
    <p class="muted center">حساب ندارید؟ <a class="link" href="{% url 'accounts:register' %}{% if next %}?next={{ next|urlencode }}{% endif %}">ثبت‌نام</a></p>
  </form>
</div>
{% endblock %}
